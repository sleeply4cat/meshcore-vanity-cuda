name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']            # tag pushes (vX.Y.Z) build + publish a release
  pull_request:

# Needed so the release job can create a GitHub Release.
permissions:
  contents: write

# Codegen targets of the two release variants (see the Makefile), for the
# Windows builds. Linux goes through `make release` / `make release-slim`;
# keep GENCODE_FULL / GENCODE_SLIM there in sync with these.
env:
  GENCODE_SLIM: -gencode arch=compute_60,code=compute_60
  GENCODE_FULL: >-
    -gencode arch=compute_60,code=sm_60
    -gencode arch=compute_70,code=sm_70
    -gencode arch=compute_75,code=sm_75
    -gencode arch=compute_80,code=sm_80
    -gencode arch=compute_86,code=sm_86
    -gencode arch=compute_89,code=sm_89
    -gencode arch=compute_90,code=sm_90
    -gencode arch=compute_90,code=compute_90
    -gencode arch=compute_120,code=sm_120
    -gencode arch=compute_120,code=compute_120

jobs:
  # ---- Compile check on every push / PR (not tags) ------------------------
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - name: Install build prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git ca-certificates
      - uses: actions/checkout@v4
      - name: Compile check
        run: |
          nvcc --version
          make ARCH=sm_86
          ./meshcore-vanity --help

  # ---- Release builds, tags only ------------------------------------------
  # Two variants: full = machine code for every generation, slim = PTX only,
  # compiled by the driver on the user's machine on the first run.
  linux:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [full, slim]
    env:
      PKG: meshcore-vanity${{ matrix.variant == 'slim' && '-slim' || '' }}-linux-x86_64.tar.gz
    # ubuntu22.04 base keeps the binary portable to older distros (glibc 2.35).
    # CUDA 12.9: the last 12.x — sm_120 (RTX 50) SASS, and still sm_60/sm_70.
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - name: Install build prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git ca-certificates
      - uses: actions/checkout@v4
      - name: Build portable binary
        run: |
          nvcc --version
          make ${{ matrix.variant == 'slim' && 'release-slim' || 'release' }}
          ./meshcore-vanity --help
          tar czf $PKG meshcore-vanity README.md FAQ.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}
          path: ${{ env.PKG }}

  windows:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2022        # VS2022 / MSVC preinstalled
    strategy:
      matrix:
        variant: [full, slim]
    env:
      PKG: meshcore-vanity${{ matrix.variant == 'slim' && '-slim' || '' }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.9.1'
          method: 'network'
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build portable binary
        shell: cmd
        env:        # step level: a job's env cannot read the workflow's
          GENCODE: ${{ matrix.variant == 'slim' && env.GENCODE_SLIM || env.GENCODE_FULL }}
        run: |
          nvcc --version
          nvcc -O3 -Xptxas -O3 --std=c++14 -Xcompiler "/MT" %GENCODE% src\main.cu -o meshcore-vanity.exe
          meshcore-vanity.exe --help
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path meshcore-vanity.exe,README.md,FAQ.md,LICENSE -DestinationPath $env:PKG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: ${{ env.PKG }}

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
